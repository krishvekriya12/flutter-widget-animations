<svg xmlns="http://www.w3.org/2000/svg" width="280" height="586" viewBox="0 0 280 586">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="276" height="582" rx="28" fill="url(#cardBg)" stroke="#2b2b3d" stroke-width="2"/>
  <rect x="10" y="10" width="260" height="566" rx="22" fill="none" stroke="#373752" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phone Notch / Island -->
  <rect x="100" y="18" width="80" height="16" rx="8" fill="#09090e"/>

  <!-- Center Content -->
  <g transform="translate(140, 260)" text-anchor="middle">
    <!-- Glowing Circle -->
    <circle cx="0" cy="0" r="42" fill="#1e1e32" stroke="url(#accent)" stroke-width="2"/>
    <!-- Hourglass / Sparkle Icon -->
    <text x="0" y="10" font-size="30" text-anchor="middle">✨</text>

    <!-- Text -->
    <text x="0" y="70" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1">DAY 03</text>
    <text x="0" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Coming Soon</text>
    <text x="0" y="118" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Stay tuned for next UI demo</text>
  </g>
</svg>
